[project]
name = "latent-working-memory"
version = "0.1.0"
description = "Research infrastructure for streaming mutable latent memory"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "accelerate>=1.14,<2",
    "peft>=0.17,<1",
    "pyarrow>=21,<26",
    "pysbd>=0.3.4,<0.4",
    "sacrebleu>=2.5,<3",
    "safetensors>=0.6,<1",
    "swanlab>=0.10,<1",
    "tensordict>=0.8,<0.11",
    "torch>=2.6,<3",
    "transformers>=4.55,<5",
    "verl==0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.12,<0.14",
]
cuda124 = ["torch==2.6.0"]
torch214 = ["torch==2.14.0"]

[tool.uv]
default-groups = ["dev", "cuda124"]
conflicts = [[{ group = "cuda124" }, { group = "torch214" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", group = "cuda124", marker = "sys_platform == 'linux'" },
    { index = "pypi", group = "cuda124", marker = "sys_platform != 'linux'" },
    { index = "pypi", group = "torch214" },
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/latent_working_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["PLC0415"]
