[project]
name = "latent-working-memory"
version = "0.1.0"
description = "Research infrastructure for streaming mutable latent memory"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "peft>=0.17,<1",
    "pyarrow>=21,<26",
    "pysbd>=0.3.4,<0.4",
    "sacrebleu>=2.5,<3",
    "swanlab>=0.10,<1",
    "torch>=2.7,<3",
    "transformers>=4.55,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.12,<0.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/latent_working_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["PLC0415"]
