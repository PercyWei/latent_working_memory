[project]
name = "latent-working-memory"
version = "0.1.0"
description = "Research infrastructure for streaming mutable latent memory"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "accelerate>=1.14,<2",
    "beautifulsoup4>=4.12,<5",
    "html2text>=2024.2,<2027",
    "nltk>=3.9,<4",
    "peft>=0.17,<1",
    "pyarrow>=21,<26",
    "pyecharts>=2.1,<3",
    "pysbd>=0.3.4,<0.4",
    "python-dotenv>=1.2,<2",
    "PyYAML>=6,<7",
    "sacrebleu>=2.5,<3",
    "scipy>=1.14,<2",
    "safetensors>=0.6,<1",
    "streamlit>=1.66,<2",
    "swanlab>=0.10,<1",
    "tensordict>=0.8,<0.11",
    "tenacity>=9,<10",
    "torch>=2.6,<3",
    "transformers>=4.55,<5",
    "verl==0.8.0",
    "wonderwords>=2.2,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "flashinfer-python==0.2.5; sys_platform == 'darwin'",
    "pytest>=8.4,<9",
    "ruff>=0.12,<0.14",
]
cuda124 = [
    "torch==2.6.0",
    "flashinfer-python==0.2.5+cu124torch2.6; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
torch214 = ["torch==2.14.0"]

[tool.uv]
default-groups = ["dev", "cuda124"]
conflicts = [[{ group = "cuda124" }, { group = "torch214" }]]

[tool.uv.sources]
flashinfer-python = [
    { index = "flashinfer-cu124", marker = "sys_platform == 'linux'" },
    { index = "pypi", marker = "sys_platform == 'darwin'" },
]

# 官方索引无独立 metadata；按 v0.2.5 setup.py 的 AOT 依赖避免锁定时下载整个 wheel。
[[tool.uv.dependency-metadata]]
name = "flashinfer-python"
version = "0.2.5+cu124torch2.6"
requires-python = ">=3.8,<4.0"
requires-dist = ["torch==2.6.*"]

[[tool.uv.index]]
name = "flashinfer-cu124"
url = "https://flashinfer.ai/whl/cu124/torch2.6/"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple/"
default = true

[tool.hatch.build.targets.wheel]
packages = ["src/latent_working_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["PLC0415"]
