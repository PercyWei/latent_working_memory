[project]
name = "cdic-reproduction"
version = "0.1.0"
description = "Paper-based reproduction of Context-Driven Incremental Compression"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "peft>=0.17,<1",
    "swanlab>=0.10,<0.11",
    "torch>=2.7,<3",
    "transformers>=4.55,<5",
]

[project.scripts]
cdic-run-dialogue = "cdic_repro.run_dialogue:main"
cdic-train-msc = "cdic_repro.experiments.msc.train:main"
cdic-eval-msc = "cdic_repro.experiments.msc.evaluate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.12,<0.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cdic_repro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires a CUDA GPU and local model resources",
    "slow: runs the real 7B model and may take several minutes",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
extend-select = ["PLC0415"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "aliyun-pypi"
url = "https://mirrors.aliyun.com/pypi/simple"
default = true
