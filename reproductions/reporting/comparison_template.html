<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>复现与论文对比</title>
  <style>
    :root{color-scheme:light;--ink:#17243a;--muted:#617088;--line:#dfe5ed;--blue:#2463c8;--green:#168166;--gray:#818b99}
    *{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#f4f6fa;color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    main{max-width:1180px;margin:auto;padding:36px 28px 44px}h1,h2,h3,p{margin:0}h1{font-size:28px;letter-spacing:-.5px;line-height:1.3}h2{font-size:18px}h3{font-size:16px}
    .subtitle{margin-top:9px;color:var(--muted);overflow-wrap:anywhere}
    .panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px;margin-top:20px;min-width:0}.section-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:14px}.hint{color:var(--muted);font-size:12px}
    .legend{display:flex;flex-wrap:wrap;gap:10px 22px;margin:14px 0 8px;color:var(--muted);font-size:12px}.legend span{display:inline-flex;align-items:center;gap:7px}.swatch{display:inline-block;width:23px;border-top:3px solid}.swatch.gray{border-top-style:dashed}
    .ours{color:var(--blue)}.paper-main{color:var(--green)}.paper-extra{color:var(--gray)}.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:24px}.chart{min-width:0}.chart svg{display:block;width:100%;height:auto}.chart h3{margin-top:8px}
    .table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;white-space:nowrap}th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:right}th{font-size:12px;font-weight:600;color:var(--muted);background:#f8fafc}th:first-child,.group-name,.task-name{text-align:left}tbody tr:last-child td{border-bottom:0}.group-name{vertical-align:top;font-weight:600}.group-start td{border-top:1px solid var(--line)}.delta{margin-left:8px;font-size:12px}
    label{display:flex;align-items:center;gap:9px;color:var(--muted);white-space:nowrap}select{border:1px solid #cdd5e0;background:#fff;border-radius:6px;padding:6px 28px 6px 10px;font:inherit;color:var(--ink)}select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
    .unit-note{margin-top:12px;color:var(--muted);font-size:12px}
    @media(max-width:760px){main{padding:24px 16px 32px}h1{font-size:24px}.charts{grid-template-columns:1fr;gap:8px}.panel{padding:15px}.section-head{align-items:flex-start;flex-wrap:wrap}th,td{padding:10px}table{min-width:640px}}
    @media print{body{background:white}main{max-width:none;padding:0}.panel{break-inside:avoid}.table-wrap{overflow:visible}}
  </style>
</head>
<body>
  <main>
    <header>
      <h1 id="report-title"></h1>
      <p class="subtitle" id="model-label"></p>
    </header>
    <section class="panel" id="overview-panel" aria-labelledby="overview-title">
      <h2 id="overview-title">分组均值</h2>
      <div class="legend" id="legend" aria-label="图表图例"></div>
      <div class="charts" id="charts"></div>
      <p class="unit-note">纵轴为得分（%）；悬停数据点可查看数值。</p>
    </section>
    <section class="panel" id="comparison-panel" aria-labelledby="comparison-title">
      <div class="section-head"><h2 id="comparison-title">分组对比</h2><span class="hint">差值 = 论文 − 复现（百分点）</span></div>
      <div class="table-wrap"><table><thead><tr id="group-head"></tr></thead><tbody id="group-rows"></tbody></table></div>
    </section>
    <section class="panel" id="benchmark-panel" aria-labelledby="benchmark-title">
      <div class="section-head"><h2 id="benchmark-title">Benchmark 对比</h2><span class="hint">差值 = 论文 − 复现（百分点）</span></div>
      <div class="legend" id="benchmark-legend" aria-label="图表图例"></div>
      <div class="charts" id="benchmark-charts"></div>
      <div class="table-wrap"><table><thead><tr id="benchmark-head"></tr></thead><tbody id="benchmark-rows"></tbody></table></div>
    </section>
    <section class="panel" id="tasks-panel" aria-labelledby="tasks-title">
      <div class="section-head">
        <h2 id="tasks-title">逐任务结果</h2>
        <label for="length-select">评估长度 <select id="length-select"></select></label>
      </div>
      <div class="table-wrap"><table><thead><tr id="task-head"></tr></thead><tbody id="task-rows"></tbody></table></div>
      <p class="unit-note" id="task-note"></p>
    </section>
  </main>
  <script id="report-data" type="application/json">__REPORT_DATA__</script>
  <script>
    "use strict";
    const data = JSON.parse(document.getElementById("report-data").textContent);
    const byId = id => document.getElementById(id);
    const node = (tag, text, className) => {
      const el = document.createElement(tag);
      if (text !== undefined) el.textContent = text;
      if (className) el.className = className;
      return el;
    };
    const score = value => value === null ? "—" : value.toFixed(2);
    const count = value => value === null ? "—" : value.toLocaleString("zh-CN");
    const difference = (paper, ours) => {
      const rounded = Math.round((paper - ours) * 100) / 100;
      return (rounded >= 0 ? "+" : "-") + Math.abs(rounded).toFixed(2);
    };
    document.title = data.title;
    byId("report-title").textContent = data.title;
    byId("model-label").textContent = data.model_label;
    const svgNS = "http://www.w3.org/2000/svg";
    const svgNode = (tag, attrs, text) => {
      const el = document.createElementNS(svgNS, tag);
      for (const [key, value] of Object.entries(attrs)) el.setAttribute(key, value);
      if (text !== undefined) el.textContent = text;
      return el;
    };
    const references = data.references.map(({key, label}, index) => ({
      key, label, className:index === 0 ? "paper-main" : "paper-extra",
      color:index === 0 ? "#168166" : "#818b99", dash:index === 0 ? "" : "6 5"
    }));
    const ours = {key:"ours", label:"本次评估", className:"ours", color:"#2463c8"};
    const allSeries = [ours, ...references];
    function legend(id) {
      for (const item of allSeries) {
        const label = node("span");
        label.append(node("i", undefined, "swatch " + item.className + (item.dash ? " gray" : "")), document.createTextNode(item.label));
        byId(id).append(label);
      }
    }
    function scoreHeaders(head) {
      head.append(node("th", "复现（%）", "ours"));
      for (const reference of references) head.append(node("th", reference.label + "（%）", reference.className));
    }
    function appendScores(tr, row) {
      tr.append(node("td", score(row.ours), "ours"));
      for (const reference of references) {
        const value = row[reference.key];
        const cell = node("td", score(value), reference.className);
        if (value !== null && row.ours !== null) {
          const delta = node("span", difference(value, row.ours), "delta");
          delta.title = "论文 − 复现（百分点）";
          cell.append(delta);
        }
        tr.append(cell);
      }
    }
    function chart(group) {
      const container = node("div", undefined, "chart");
      container.append(node("h3", group.label));
      const svg = svgNode("svg", {viewBox:"0 0 520 270", role:"img", "aria-label":group.label + "按评估长度的得分对比"});
      const x = index => group.rows.length === 1 ? 260 : 50 + index * 420 / (group.rows.length - 1);
      const y = value => 226 - value * 1.88;
      for (const tick of [0, 25, 50, 75, 100]) {
        svg.append(svgNode("line", {x1:50, x2:470, y1:y(tick), y2:y(tick), stroke:"#e7ebf1"}));
        svg.append(svgNode("text", {x:38, y:y(tick)+4, "text-anchor":"end", fill:"#617088", "font-size":12}, tick));
      }
      group.rows.forEach((row, index) => svg.append(svgNode("text", {x:x(index), y:249, "text-anchor":"middle", fill:"#617088", "font-size":12}, row.label)));
      // 论文参照先绘制，本次评估最后绘制，保持蓝线在最上层。
      for (const line of [...references].reverse().concat(ours)) {
        let segment = [];
        function flushSegment() {
          if (segment.length > 1) {
            const attrs = {points:segment.join(" "), fill:"none", stroke:line.color, "stroke-width":2.5};
            if (line.dash) attrs["stroke-dasharray"] = line.dash;
            svg.append(svgNode("polyline", attrs));
          }
          segment = [];
        }
        group.rows.forEach((row, index) => {
          const value = row[line.key];
          if (value === null) {
            flushSegment();
          } else {
            segment.push(x(index) + "," + y(value));
          }
        });
        flushSegment();
        group.rows.forEach((row, index) => {
          const value = row[line.key];
          if (value === null) return;
          const point = svgNode("circle", {cx:x(index), cy:y(value), r:4, fill:"white", stroke:line.color, "stroke-width":2});
          point.append(svgNode("title", {}, line.label + " · " + row.label + "：" + score(value) + "%"));
          svg.append(point);
        });
      }
      container.append(svg);
      return container;
    }
    byId("overview-panel").hidden = data.groups.length === 0;
    byId("comparison-panel").hidden = data.groups.length === 0;
    if (data.groups.length) {
      legend("legend");
      const head = byId("group-head");
      head.append(node("th", "任务组"), node("th", "长度"));
      scoreHeaders(head);
      data.groups.forEach((group, groupIndex) => {
        byId("charts").append(chart(group));
        group.rows.forEach((row, index) => {
          const tr = node("tr", undefined, groupIndex > 0 && index === 0 ? "group-start" : "");
          if (index === 0) {
            const label = node("td", group.label, "group-name");
            label.rowSpan = group.rows.length;
            tr.append(label);
          }
          tr.append(node("td", row.label));
          appendScores(tr, row);
          byId("group-rows").append(tr);
        });
      });
    }
    byId("benchmark-panel").hidden = data.benchmarks.length === 0;
    if (data.benchmarks.length) {
      legend("benchmark-legend");
      const head = byId("benchmark-head");
      head.append(node("th", "Benchmark"));
      scoreHeaders(head);
      head.append(node("th", "样本数"));
      for (const row of data.benchmarks) {
        const tr = node("tr");
        tr.append(node("td", row.label, "task-name"));
        appendScores(tr, row);
        tr.append(node("td", count(row.samples)));
        byId("benchmark-rows").append(tr);
        const container = node("div", undefined, "chart");
        container.append(node("h3", row.label));
        const height = allSeries.length * 34 + 48;
        const svg = svgNode("svg", {viewBox:"0 0 520 " + height, role:"img", "aria-label":row.label + "得分对比"});
        for (const tick of [0, 25, 50, 75, 100]) {
          const x = 150 + tick * 2.8;
          svg.append(svgNode("line", {x1:x, x2:x, y1:18, y2:height-28, stroke:"#e7ebf1"}));
          svg.append(svgNode("text", {x, y:height-8, "text-anchor":"middle", fill:"#617088", "font-size":12}, tick + "%"));
        }
        allSeries.forEach((item, index) => {
          const value = row[item.key], y = 27 + index * 34;
          svg.append(svgNode("text", {x:140, y:y+14, "text-anchor":"end", fill:item.color, "font-size":12}, item.label));
          if (value !== null) {
            const bar = svgNode("rect", {x:150, y, width:value*2.8, height:20, rx:3, fill:item.color});
            bar.append(svgNode("title", {}, item.label + "：" + score(value) + "%"));
            svg.append(bar);
          }
          svg.append(svgNode("text", {x:value === null ? 157 : 157+value*2.8, y:y+14, fill:item.color, "font-size":12}, score(value)));
        });
        container.append(svg);
        byId("benchmark-charts").append(container);
      }
    }
    byId("tasks-panel").hidden = data.tasks.length === 0;
    if (data.tasks.length) {
      const head = byId("task-head");
      head.append(node("th", "任务"));
      scoreHeaders(head);
      head.append(node("th", "样本数"));
      byId("task-note").textContent = data.task_note;
      byId("task-note").hidden = data.task_note === "";
      const select = byId("length-select");
      for (const row of data.tasks[0].rows) {
        const option = node("option", row.label);
        option.value = row.length;
        select.append(option);
      }
      function renderTasks() {
        byId("task-rows").replaceChildren();
        for (const task of data.tasks) {
          const row = task.rows.find(item => item.length === Number(select.value));
          const tr = node("tr");
          tr.append(node("td", task.label, "task-name"));
          appendScores(tr, row);
          tr.append(node("td", count(row.samples)));
          byId("task-rows").append(tr);
        }
      }
      select.addEventListener("change", renderTasks);
      renderTasks();
    }
  </script>
</body>
</html>
